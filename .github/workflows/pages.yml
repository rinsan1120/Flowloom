name: Build, test and deploy Flowloom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Set up Chromium smoke test
        run: |
          npm install --prefix "$RUNNER_TEMP/flowloom-smoke" --no-audit --no-fund playwright
          "$RUNNER_TEMP/flowloom-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke test
        run: |
          npm run preview -- --port 4173 > /tmp/flowloom-preview.log 2>&1 &
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/flowloom-smoke/node_modules/playwright/index.mjs" node scripts/smoke.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
